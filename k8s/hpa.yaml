# No autoscale needed for this service

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-fde-api
  namespace: fde
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fde-api
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80