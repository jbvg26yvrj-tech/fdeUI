version: "3.8"

services:
  mock-dispatcher:
    build: ./mock-dispatcher
    container_name: mock-dispatcher
    ports:
      - "18080:8080"

  fde-api:
    build:
      context: .
      args:
        artifactPath: target/fde-api-2.0.0-SNAPSHOT.jar
    container_name: fde-api
    ports:
      - "19096:8082"
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      DB_NAME: fde_dispatcher
      DB_USERNAME: rwxxik
      DB_PASSWORD: dispatcher123
      FDE_DISPATCHER_URL: http://mock-dispatcher:8080
      JWT_ACCESS_SECRET: fde-api-local-test-access-secret-key-minimum-32-chars
      JWT_REFRESH_SECRET: fde-api-local-test-refresh-secret-key-minimum-32-chars
      SERVER_PORT: 8082
      LOG_LEVEL: DEBUG
    depends_on:
      - mock-dispatcher
    extra_hosts:
      - "host.docker.internal:host-gateway"
