spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS pipelines\;CREATE SCHEMA IF NOT EXISTS auth\;SET SCHEMA pipelines
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    properties:
      hibernate:
        default_schema: pipelines
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    schemas: pipelines,auth
    locations: classpath:db/migration

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false

fde:
  dispatcher:
    url: http://localhost:18080
    connect-timeout: 1s
    response-timeout: 5s

app:
  jwt:
    # Test-only secrets — safe defaults for CI/test environment
    access-secret: test-access-secret-key-minimum-32-characters-long
    refresh-secret: test-refresh-secret-key-minimum-32-characters-long
    access-expiration: 600000
    refresh-expiration: 9000000
  cors:
    allowed-origins: http://localhost:3000
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: authorization,content-type,x-correlation-id
    exposed-headers: authorization,x-correlation-id
    max-age: 3600
    allow-credentials: true

logging:
  level:
    ru.spasibo.bilt.fdeapi: DEBUG